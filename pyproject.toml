[project]
name = "sound-notify-mcp"
version = "0.1.0"
description = "MCP server that lets Claude play a notification chime when it finishes a task"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0"]

[project.scripts]
sound-notify = "sound_notify.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
